# Render Blueprint for JanSamadhan. Syncing this file documents the exact
# production topology; secrets are NEVER stored here (sync: false means
# Render prompts for values and keeps them out of git).
#
# Previews/deploys: backend serves the API, both frontends are static SPAs
# with a /* -> /index.html rewrite so BrowserRouter deep links work.

services:
  - type: web
    name: jansamadhan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_ATTACHMENTS_BUCKET
        value: attachments
      - key: OTP_PROVIDER
        value: brevo
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: JanSamadhan
      - key: FRONTEND_URL
        value: https://jansamadhan-public.onrender.com
      - key: CORS_ORIGINS
        value: https://jansamadhan-public.onrender.com,https://jansamadhan-government.onrender.com

  - type: web
    name: jansamadhan-public
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jansamadhan-backend.onrender.com/api/v1

  - type: web
    name: jansamadhan-government
    runtime: static
    rootDir: government-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jansamadhan-backend.onrender.com/api/v1
